[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qsimbench"
version = "0.1.0"
description = "CPU state-vector quantum circuit simulation and benchmarking (no GPU)"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pandas>=2.0", "psutil>=5.9", "threadpoolctl>=3.1"]

[project.optional-dependencies]
ui = ["streamlit>=1.40", "plotly>=5.20"]
dev = ["pytest>=8", "qiskit>=1.0"]

[project.scripts]
qsimbench = "qsimbench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
